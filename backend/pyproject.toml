[project]
name = "buildwise-backend"
version = "0.1.0"
description = "BUILDWISE 백엔드 — 기업 상품 데이터를 연결하는 AI 판매 상담 엔진"
requires-python = ">=3.14,<3.15"
# 버전은 정확히 고정합니다. 올릴 때는 팀에 알리고 PR 로 올립니다(docs/DEVELOPMENT_RULES.md 9번).
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "mysql-connector-python==26.10.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[tool.uv]
# 이 폴더는 라이브러리가 아니라 앱이라 패키지로 빌드하지 않습니다.
package = false
required-version = ">=0.13"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # 줄 길이는 ruff format 이 맞춥니다. 한글은 글자 폭이 2라 문자열·주석 경고가 과하게 납니다.
    "RUF001", # 한글 문서 안의 전각 문자 경고
    "RUF002",
    "RUF003",
    "B008",   # FastAPI 의존성 주입 문법
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
