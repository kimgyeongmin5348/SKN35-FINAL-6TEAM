# BUILDWISE CI — PR 과 main 에 올라온 코드를 자동으로 검사합니다.
# 실패하면 Actions 탭에서 빨간 X 가 붙은 단계 이름을 보세요. 고치는 방법은 docs/QA_GUIDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  NODE_VERSION: "24.22.2"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  backend:
    name: 백엔드
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: 의존성 설치 (uv sync --frozen)
        run: uv sync --frozen
      - name: 린트 (ruff check)
        run: uv run --frozen ruff check . --output-format github
      - name: 포맷 검사 (ruff format --check)
        run: uv run --frozen ruff format --check .
      - name: 테스트 (pytest)
        run: uv run --frozen pytest -q

  contract:
    name: 계약
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: OpenAPI 스냅샷에서 타입 생성
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run gen:api
      - name: 커밋된 계약 파일과 같은지 비교
        run: |
          if ! git diff --exit-code -- contracts frontend/src/api/schema.d.ts; then
            echo "::error::계약 파일이 코드와 다릅니다. scripts/gen-contracts 를 실행하고 바뀐 파일을 같은 PR 에 커밋하세요."
            exit 1
          fi

  frontend:
    name: 프론트
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치 (npm ci)
        run: npm ci --no-audit --no-fund
      - name: 린트 (eslint)
        run: npm run lint
      - name: 포맷 검사 (prettier)
        run: npm run format:check
      - name: 타입 검사 (tsc)
        run: npm run typecheck
      - name: 단위 테스트 (vitest)
        run: npm test
      - name: 빌드 (vite build)
        run: npm run build

  windows:
    name: 윈도우
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # 윈도우 러너는 기본으로 줄바꿈을 CRLF 로 바꿔 받습니다 → .gitattributes 가 제대로 막는지 같이 확인됩니다.
      - uses: actions/checkout@v7
      - name: PowerShell 5.1 로 scripts/*.ps1 구문 · BOM 검사
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          $failed = 0
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "::error file=scripts/$($file.Name)::UTF-8 BOM missing (Windows PowerShell 5.1 breaks Korean text without it)"
              $failed++
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($err in $errors) { Write-Host "::error file=scripts/$($file.Name)::$($err.Message)" }
              $failed++
            } else {
              Write-Host "OK scripts/$($file.Name)"
            }
          }
          if ($failed -gt 0) { exit 1 }
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: 백엔드 테스트 (윈도우 경로 · 인코딩)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run --frozen pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트 포맷 · 테스트 · 빌드 (윈도우)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm test
          npm run build

  secrets:
    name: 비밀값
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 설치 (체크섬 확인)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tar.gz/' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 전체 이력에서 비밀값 찾기 (gitleaks)
        run: ./gitleaks git --redact --verbose --exit-code 1 .
