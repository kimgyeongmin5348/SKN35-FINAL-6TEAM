<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUILDWISE — AI Digital Office</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a2e;
    --panel-2: #1a233d;
    --border: #273456;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --consult: #f97316;
    --solution: #0ea5e9;
    --valid: #10b981;
    --quote: #8b5cf6;
    --pass: #10b981;
    --warn: #f59e0b;
    --fail: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: 48px 1fr 245px;
    grid-template-columns: 1fr 390px;
    gap: 8px; padding: 8px; height: 100vh;
  }
  header {
    grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .badge-pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .badge-pill.v2 { border-color: var(--consult); color: #fdba74; background: rgba(249,115,22,.12); }
  .controls { display: flex; align-items: center; gap: 6px; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  button:hover { border-color: #4f679c; background: #222e4f; }
  button.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.approve { background: #7c3aed; border-color: #a78bfa; color: #fff; }

  .office-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }
  .canvas-box {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #0d1324; overflow: hidden; position: relative; min-height: 0;
  }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  .inspector-bar {
    display: flex; align-items: center; gap: 5px; padding: 6px 10px;
    border-top: 1px solid var(--border); background: #101729; flex-wrap: wrap;
  }
  .inspector-bar span { color: var(--muted); font-size: 11px; margin-right: 4px; }
  .inspector-bar button { padding: 3px 7px; font-size: 11px; }

  .side-panel {
    grid-row: 2 / 4; grid-column: 2;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }
  .card-hd {
    padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; background: #161f37;
  }
  .card-bd { padding: 10px 12px; overflow-y: auto; flex: 1; }

  .chat-list { display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 8px; line-height: 1.45; font-size: 12.5px; }
  .msg.user { background: #1e293b; border: 1px solid #334155; align-self: flex-end; max-width: 92%; }
  .msg.agent { background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.35); max-width: 94%; }
  .msg .who { font-size: 11px; font-weight: 700; margin-bottom: 3px; color: #fdba74; }
  .msg.user .who { color: #93c5fd; }

  .bottom-grid {
    grid-column: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; min-height: 0;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 3px 8px; font-size: 11px; }
  .tabs button.active { background: #2563eb; border-color: #60a5fa; color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 700; }
  .tag.PASS { background: rgba(16,185,129,.18); color: #34d399; border: 1px solid #059669; }
  .tag.WARNING { background: rgba(245,158,11,.18); color: #fbbf24; border: 1px solid #d97706; }
  .tag.FAIL { background: rgba(239,68,68,.18); color: #f87171; border: 1px solid #dc2626; }
  .tag.PENDING { background: rgba(56,189,248,.15); color: #7dd3fc; border: 1px solid #0284c7; }

  .timeline-item {
    display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px; align-items: flex-start;
  }
  .timeline-item:hover { background: var(--panel-2); border-color: var(--border); }
  .ev-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .kv-grid { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; font-size: 12px; }
  .kv-grid div:nth-child(odd) { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span>🏢 BUILDWISE — AI Digital Office</span>
      <span class="badge-pill" id="reqVerBadge">요구사항 대기 (v0)</span>
      <span class="badge-pill" id="pipelineStage">파이프라인: 대기 중</span>
    </div>
    <div class="controls">
      <button class="primary" id="btnNext">▶ 다음 시연 단계 (<span id="stepIdx">0</span>/7)</button>
      <button id="btnAuto">⏯ 자동 시연</button>
      <button id="btnReset">↺ 초기화</button>
    </div>
  </header>

  <!-- 1. 게임형 AI Digital Office 캔버스 -->
  <div class="office-wrap">
    <div class="canvas-box">
      <canvas id="officeCanvas"></canvas>
    </div>
    <div class="inspector-bar">
      <span>에셋 모션 미리보기:</span>
      <select id="selAgent" style="background:#1a233d;color:#e2e8f0;border:1px solid #273456;border-radius:4px;padding:2px 5px;font-size:11px;">
        <option value="all">전체 팀</option>
        <option value="consultation">상담팀</option>
        <option value="solution">설계팀</option>
        <option value="validation">검증팀</option>
        <option value="quotation">견적팀</option>
      </select>
      <button data-st="idle">대기</button>
      <button data-st="talking">상담중</button>
      <button data-st="working">작업중</button>
      <button data-st="analyzing">조사·분석</button>
      <button data-st="waiting_info">추가정보대기</button>
      <button data-st="reviewing">재검토</button>
      <button data-st="waiting_approval">승인대기</button>
      <button data-st="failed">실패/FAIL</button>
      <button data-st="retrying">재시도</button>
      <button data-st="completed">완료/PASS</button>
      <button id="btnTestHandoff">📦 인계 모션</button>
    </div>
  </div>

  <!-- 2. 우측: 실시간 상담 & 현재 요구사항 요약 -->
  <div class="side-panel">
    <div class="card" style="flex: 1.3;">
      <div class="card-hd">
        <span>🎙️ 실시간 상담 패널</span>
        <span class="badge-pill" id="consultMode">음성·텍스트 즉시 응답</span>
      </div>
      <div class="card-bd chat-list" id="chatList"></div>
    </div>

    <div class="card" style="flex: 1;">
      <div class="card-hd">
        <span>📌 현재 요구사항 & 피드백 반영</span>
        <span class="badge-pill" id="fbCount">피드백 0건</span>
      </div>
      <div class="card-bd" id="reqBox"></div>
    </div>
  </div>

  <!-- 3. 하단: 업무 진행·산출물 패널 + 이벤트 타임라인 -->
  <div class="bottom-grid">
    <div class="card">
      <div class="card-hd">
        <span>📊 업무 진행 · 검증 근거 · 산출물</span>
        <div class="tabs" id="delivTabs">
          <button class="active" data-tab="candidates">추천 후보</button>
          <button data-tab="validation">검증 리포트</button>
          <button data-tab="quotation">비교표·견적서</button>
        </div>
      </div>
      <div class="card-bd" id="delivBody"></div>
    </div>

    <div class="card">
      <div class="card-hd">
        <span>⏱️ 실행 이벤트 타임라인 (클릭 시 산출물 연결)</span>
        <span class="badge-pill" id="evCount">0 events</span>
      </div>
      <div class="card-bd" id="timelineBody"></div>
    </div>
  </div>
</div>

<script src="../assets/map/office_map.js"></script>
<script>
const M = window.OFFICE_MAP;
const A = "../assets/";
const cv = document.getElementById("officeCanvas");
const ctx = cv.getContext("2d");
cv.width = M.width;
cv.height = M.height;

// ------------------------------------------------------------------ 1) Load sprite assets
const imgs = {};
const load = (k, src) => new Promise(res => {
  const i = new Image();
  i.onload = res; i.onerror = res; i.src = src; imgs[k] = i;
});

const jobs = [
  load("floor", A + "map/office_floor.png"),
  load("badges", A + "badges/badges_sheet.png"),
];
new Set(M.objects.map(o => o.name)).forEach(n => jobs.push(load("o:" + n, A + `objects/${n}.png`)));
["idle", "pass", "warn", "fail"].forEach(s => jobs.push(load("tower:" + s, A + `objects/validation_tower_${s}.png`)));
["doc_requirements", "doc_feedback", "doc_solution", "doc_validation_pass", "doc_validation_warn",
 "doc_validation_fail", "doc_quotation", "doc_email"].forEach(d => jobs.push(load("d:" + d, A + `deliverables/${d}.png`)));
M.agents.forEach(ag => {
  jobs.push(load(`ws:${ag.id}`, A + `characters/${ag.id}/${ag.id}_work_states.png`));
  jobs.push(load(`cs:${ag.id}`, A + `characters/${ag.id}/${ag.id}_carry_4dir.png`));
});

const STATE_ROW = Object.fromEntries(M.workStates.map((s, i) => [s, i]));
const BADGE_ROW = Object.fromEntries(M.badges.map((b, i) => [b, i]));
const STATE_KO = {
  idle: "대기", working: "작업 중", talking: "실시간 상담", analyzing: "사양·자원 조사",
  waiting_info: "추가 정보 대기", reviewing: "피드백 반영 재검토", waiting_approval: "사용자 승인 대기",
  failed: "실패 / 반려", retrying: "재시도 중", completed: "완료",
};

// ------------------------------------------------------------------ 2) Live UI & Agent Runtime State
const runtime = {
  reqVersion: 0,
  tower: "idle",
  activeTab: "candidates",
  step: 0,
  autoTimer: null,
  agents: {},
  couriers: [],     // non-blocking visual handoff couriers/packets
  chats: [],
  requirements: { model: "미확인 (RAM 8GB 노트북)", purpose: "바이브코딩 + 로컬 LLM 입문", budget: "-", constraint: "-", feedbackNote: "-" },
  candidates: [],
  validations: [],
  quote: null,
  events: [],
};

function resetRuntime() {
  runtime.reqVersion = 0;
  runtime.tower = "idle";
  runtime.step = 0;
  runtime.couriers = [];
  runtime.chats = [
    { role: "agent", who: "상담팀 · Consultation Agent", text: "안녕하세요! BUILDWISE AI 디지털 오피스입니다. 현재 사용 중인 장비와 원하시는 작업·예산을 편하게 말씀해 주세요." }
  ];
  runtime.requirements = { ver: "v0 (수집 전)", model: "대기 중", purpose: "대기 중", budget: "대기 중", constraint: "없음", feedbackNote: "없음" };
  runtime.candidates = [];
  runtime.validations = [];
  runtime.quote = null;
  runtime.events = [];
  M.agents.forEach(ag => {
    runtime.agents[ag.id] = { ...ag, state: "idle", badge: "idle", taskText: "대기 중" };
  });
  document.getElementById("stepIdx").textContent = "0";
  document.getElementById("reqVerBadge").textContent = "요구사항 대기 (v0)";
  document.getElementById("reqVerBadge").className = "badge-pill";
  document.getElementById("pipelineStage").textContent = "파이프라인: 대기 중";
  document.getElementById("fbCount").textContent = "피드백 0건";
  renderPanels();
}

// Spawn a non-blocking handoff courier carrying a deliverable from team A -> hub -> team B
function spawnHandoff(fromId, toId, docKey, label) {
  const src = runtime.agents[fromId], dst = runtime.agents[toId];
  if (!src || !dst) return;
  const pts = [
    { x: src.handoffX, y: src.handoffY },
    { x: M.hubPoint.x, y: src.handoffY },
    { x: M.hubPoint.x, y: dst.handoffY },
    { x: dst.handoffX, y: dst.handoffY },
  ];
  runtime.couriers.push({ sheet: fromId, doc: docKey, label, pts, seg: 0, x: pts[0].x, y: pts[0].y, dir: "right", t: 0 });
}

// ------------------------------------------------------------------ 3) 7-Step BUILDWISE Full Scenario (Initial -> Validation Fail Loop -> Customer Feedback -> Final Approval)
const SCENARIO = [
  // Step 1: Initial consultation + missing info check
  () => {
    runtime.chats.push(
      { role: "user", who: "고객", text: "지금 RAM 8GB 노트북으로 바이브코딩 중인데 로컬 LLM도 돌려보고 싶어요. 예산은 150만 원 정도예요." },
      { role: "agent", who: "상담팀 · Consultation Agent", text: "반갑습니다! 8GB 노트북에서 로컬 LLM 병행을 원하시는군요. RAM 확장 가능 여부를 정확히 검증하기 위해 현재 노트북의 정확한 모델명을 알려주시겠어요?" }
    );
    runtime.requirements = { ver: "v1-draft (추가 확인 중)", model: "RAM 8GB 노트북 (모델명 미확인)", purpose: "바이브코딩 + 로컬 LLM (7B~8B)", budget: "150만 원", constraint: "미지정", feedbackNote: "-" };
    setAgent("consultation", "waiting_info", "waiting_info", "노트북 상세 모델명 질문 중");
    pushEvent("requirements.Clarification", "consultation", "v1-draft", "RAM 확장 가능 여부 판별을 위해 노트북 모델명 요청", "candidates");
    setHeader("v1-draft", "상담팀 추가 정보 확인 대기");
  },
  // Step 2: Model confirmed -> Requirements v1 -> Handoff to Solution
  () => {
    runtime.chats.push(
      { role: "user", who: "고객", text: "모델명은 LG 그램 16ZD90Q예요!" },
      { role: "agent", who: "상담팀 · Consultation Agent", text: "확인 감사합니다! 요구사항(v1)을 확정하고 설계팀과 검증팀에 백그라운드 조사를 요청했습니다. 조사 중에도 궁금한 점(예: VRAM 개념)은 바로 질문하셔도 됩니다." }
    );
    runtime.reqVersion = 1;
    runtime.requirements = { ver: "Req v1", model: "LG 그램 16ZD90Q (LPDDR5 8GB 온보드)", purpose: "바이브코딩 + 로컬 LLM (7B~14B)", budget: "150만 원 이하", constraint: "없음", feedbackNote: "최초 요구사항 확정" };
    setAgent("consultation", "talking", "talking", "실시간 상담 유지 · 요구사항 v1 전달");
    setAgent("solution", "working", "working", "유지·업그레이드·신규·클라우드 후보 설계 중");
    spawnHandoff("consultation", "solution", "doc_requirements", "Req v1");
    pushEvent("requirements.updated", "consultation", "v1", "요구사항 v1 확정 → 설계팀 비동기 작업 접수", "candidates");
    pushEvent("solution.started", "solution", "v1", "자원 분석 및 4대 대안 후보 탐색 시작", "candidates");
    setHeader("Req v1", "설계팀 후보 생성 중");
  },
  // Step 3: Solution v1 -> Validation detects soldered RAM FAIL -> Re-review loop!
  () => {
    runtime.candidates = [
      { ver: "v1", type: "업그레이드", name: "현재 그램 RAM 32GB 증설", cost: "18만 원", status: "FAIL", note: "검증팀 반려: 온보드 납땜 슬롯" },
      { ver: "v1", type: "신규 구매", name: "RTX 4070 SUPER 12GB 데스크톱", cost: "148만 원", status: "PENDING", note: "사양·전력 호환성 검증 중" },
      { ver: "v1", type: "클라우드", name: "RunPod RTX 4090 시간제 + 현재 노트북", cost: "월 약 6만 원", status: "PENDING", note: "네트워크·보안 조건 확인 중" },
    ];
    runtime.validations = [
      { item: "LG 16ZD90Q 메모리 확장안", result: "FAIL", source: "LG전자 공식 제품 사양서", detail: "LPDDR5 온보드 고정형으로 슬롯 증설 불가 → 설계팀 재검토 요청" },
    ];
    runtime.tower = "fail";
    setAgent("validation", "failed", "fail", "온보드 RAM 증설 불가(FAIL) 탐지 → 반려");
    setAgent("solution", "reviewing", "reviewing", "검증팀 반려 근거 수신 · 업그레이드안 제외 재설계");
    spawnHandoff("validation", "solution", "doc_validation_fail", "FAIL 근거 전달");
    pushEvent("solution.completed", "solution", "v1", "1차 추천 후보 3종 생성 완료", "candidates");
    pushEvent("validation.failed", "validation", "v1", "16ZD90Q RAM 증설 불가 확인 → 설계팀 재검토 요청", "validation");
    setHeader("Req v1", "검증 실패(FAIL) → 설계팀 재검토 루프");
  },
  // Step 4: Re-validation PASS/WARNING on v1 -> Intermediate results shown clearly
  () => {
    runtime.candidates = [
      { ver: "v1", type: "신규 구매 (검증완료)", name: "RTX 4070 SUPER 12GB 로컬 PC", cost: "148만 원", status: "PASS", note: "8B~14B 양자화 모델 원활 구동 확인" },
      { ver: "v1", type: "클라우드 (조건부)", name: "클라우드 GPU (L4/4090) + 기존 그램", cost: "초기 0원 / 월 과금", status: "WARNING", note: "외부 서버 코드·문서 전송 발생 주의" },
    ];
    runtime.validations = [
      { item: "RTX 4070 SUPER 12GB + 32GB DDR5 구성", result: "PASS", source: "NVIDIA / 보드 QVL 공식 사양", detail: "VRAM 12GB로 Llama-3 8B Q4_K_M 및 코딩 어시스턴트 동시 상주 충족" },
      { item: "클라우드 GPU 임대 구성", result: "WARNING", source: "보안 정책 체크리스트", detail: "사내 보안 데이터 활용 시 외부 전송 제약 여부 확인 필요" },
    ];
    runtime.tower = "warn";
    setAgent("solution", "completed", "pass", "1차 대안 재정리 완료");
    setAgent("validation", "completed", "warning", "PASS 1건 · WARNING 1건 구분 완료");
    setAgent("consultation", "talking", "talking", "검증 완료 추천과 제약사항 중간 안내");
    spawnHandoff("validation", "consultation", "doc_validation_warn", "1차 검증 결과");

function setAgent(id, state, badge, taskText) {
  const a = runtime.agents[id];
  if (!a) return;
  a.state = state; a.badge = badge; a.taskText = taskText;

function setHeader(verText, stageText) {
  document.getElementById("reqVerBadge").textContent = verText;
  document.getElementById("pipelineStage").textContent = "파이프라인: " + stageText;
}

function pushEvent(type, agent, ver, summary, tab) {
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);
  runtime.events.unshift({
    id: "evt_" + (runtime.events.length + 1).toString().padStart(3, "0"),
    type, agent, ver, ts, summary, tab,
  });
}

// Public hook so real backend WebSocket / SSE can drive the exact same UI!

  dispatch(ev) {
    if (ev.agent && ev.state) setAgent(ev.agent, ev.state, ev.badge || "working", ev.taskText || ev.type);
    if (ev.tower) runtime.tower = ev.tower;
    if (ev.handoff) spawnHandoff(ev.handoff.from, ev.handoff.to, ev.handoff.doc || "doc_requirements", ev.handoff.label || "");
    pushEvent(ev.type || "custom.event", ev.agent || "orchestrator", ev.reqVersion || "v1", ev.summary || "", ev.tab || "candidates");
    renderPanels();
  }
};

// ------------------------------------------------------------------ 5) Canvas Render Loop (Non-blocking animations)
function drawPill(text, cx, y, bg, border, textColor = "#fff", font = "bold 11px sans-serif") {
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 12;
  const x = Math.round(cx - w / 2);
  ctx.fillStyle = bg;
  ctx.strokeStyle = border;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(x, y, w, 18, 5);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.textAlign = "center";
  ctx.fillText(text, cx, y + 13);
}

const CARRY_ROW = { down: 0, left: 1, right: 2, up: 3 };

function updateCouriers(dt) {
  const speed = 155;
  runtime.couriers = runtime.couriers.filter(c => {
    const target = c.pts[c.seg + 1];
    if (!target) return false;
    const dx = target.x - c.x, dy = target.y - c.y;
    const dist = Math.hypot(dx, dy);
    if (Math.abs(dx) > Math.abs(dy)) c.dir = dx >= 0 ? "right" : "left";
    else c.dir = dy >= 0 ? "down" : "up";
    if (dist <= speed * dt) {
      c.x = target.x; c.y = target.y; c.seg++;
      return c.seg < c.pts.length - 1;
    }
    c.x += (dx / dist) * speed * dt;
    c.y += (dy / dist) * speed * dt;
    c.t += dt;
    return true;
  });
}

function renderCanvas(now, dt) {
  updateCouriers(dt);
  ctx.drawImage(imgs.floor, 0, 0);

  const animFrame = Math.floor(now / 190) % 4;
  const badgeFrame = Math.floor(now / 240) % 4;

  // Depth-sorted draw list
  const list = [];
  M.objects.forEach(o => list.push([o.y + o.h, () => ctx.drawImage(imgs["o:" + o.name], o.x, o.y)]));

  const tw = M.validationTower;
  list.push([tw.y + 64, () => ctx.drawImage(imgs["tower:" + runtime.tower], tw.x, tw.y)]);

  Object.values(runtime.agents).forEach(ag => {
    list.push([ag.sortY, () => {
      const sheet = imgs[`ws:${ag.id}`];
      const row = STATE_ROW[ag.state] ?? 0;
      ctx.drawImage(sheet, animFrame * 64, row * 64, 64, 64, ag.seatX, ag.seatY, 64, 64);

      // Animated pixel status bubble above head
      const brow = BADGE_ROW[ag.badge] ?? 0;
      ctx.drawImage(imgs.badges, badgeFrame * 32, brow * 32, 32, 32, ag.seatX + 16, ag.seatY - 26, 32, 32);
    }]);
  });

  // Handoff couriers walking along lanes carrying deliverables
  runtime.couriers.forEach(c => {
    list.push([c.y + 60, () => {
      const csheet = imgs[`cs:${c.sheet}`];
      const crow = CARRY_ROW[c.dir] ?? 0;
      const cf = Math.floor(c.t * 9) % 4;
      ctx.drawImage(csheet, cf * 64, crow * 64, 64, 64, Math.round(c.x) - 32, Math.round(c.y) - 48, 64, 64);
      if (imgs["d:" + c.doc]) {
        ctx.drawImage(imgs["d:" + c.doc], Math.round(c.x) - 14, Math.round(c.y) - 74);
      }
      if (c.label) drawPill(c.label, Math.round(c.x), Math.round(c.y) - 92, "rgba(15,23,42,.9)", "#60a5fa", "#e0f2fe", "bold 10px sans-serif");
    }]);
  });

  list.sort((a, b) => a[0] - b[0]).forEach(([, fn]) => fn());

  // Overlay crisp zone titles & current step labels (no fake percentages!)
  Object.values(runtime.agents).forEach(ag => {
    const [zx, zy, zw] = ag.zoneRect;
    drawPill(`${ag.team} · ${STATE_KO[ag.state] || ag.state}`, zx + zw / 2, zy - 9, "rgba(15,23,42,.88)", ag.color);
    drawPill(ag.taskText, ag.seatX + 32, ag.seatY + 96, "rgba(15,23,42,.84)", "#334155", "#e2e8f0", "11px sans-serif");
  });

  // Orchestrator Hub label
  drawPill(`Orchestrator · ${runtime.reqVersion ? "Req v" + runtime.reqVersion : "대기"}`, 480, 262, "rgba(15,23,42,.9)", "#64748b", "#f8fafc", "bold 10.5px sans-serif");
}

// ------------------------------------------------------------------ 6) Controls & Bindings
function stepNext() {
  if (runtime.step >= SCENARIO.length) resetRuntime();
  else {
    SCENARIO[runtime.step]();
    runtime.step++;
    document.getElementById("stepIdx").textContent = runtime.step.toString();
    renderPanels();
  }
}

document.getElementById("btnNext").onclick = stepNext;
document.getElementById("btnReset").onclick = () => {
  if (runtime.autoTimer) { clearInterval(runtime.autoTimer); runtime.autoTimer = null; }
  resetRuntime();
};
document.getElementById("btnAuto").onclick = () => {
  if (runtime.autoTimer) {
    clearInterval(runtime.autoTimer); runtime.autoTimer = null;
    document.getElementById("btnAuto").textContent = "⏯ 자동 시연";
  } else {
    if (runtime.step >= SCENARIO.length) resetRuntime();
    stepNext();
    document.getElementById("btnAuto").textContent = "⏸ 일시정지";
    runtime.autoTimer = setInterval(() => {
      if (runtime.step >= SCENARIO.length) {
        clearInterval(runtime.autoTimer); runtime.autoTimer = null;
        document.getElementById("btnAuto").textContent = "⏯ 자동 시연";
      } else stepNext();
    }, 2800);
  }
};

  idle: "idle", talking: "talking", working: "working", analyzing: "analyzing",
  waiting_info: "waiting_info", reviewing: "reviewing", waiting_approval: "waiting_approval",
  failed: "fail", retrying: "retrying", completed: "pass",
};

  b.onclick = () => {
    const st = b.dataset.st;
    const target = document.getElementById("selAgent").value;
    Object.values(runtime.agents).forEach(ag => {
      if (target === "all" || ag.id === target) {
        ag.state = st;

});

let lastT = performance.now();
Promise.all(jobs).then(() => {
  resetRuntime();
  // Start at Step 2 or keep ready? Keep ready & trigger Step 1 if desired — let's show clean active initial state!
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    renderCanvas(now, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});
