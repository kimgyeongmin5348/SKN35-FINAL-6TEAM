# 프론트 개발용 설정. 로컬 MySQL은 별도로 실행합니다.
name: buildwise

services:
  frontend:
    build: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - ./contracts:/workspace/contracts
      - frontend-node-modules:/workspace/frontend/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  frontend-node-modules:
